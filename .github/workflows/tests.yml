name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # pyproject requires >= 3.11 (tomllib). Every version on Linux; one on macOS, where the
        # keyring backend and process handling differ. Windows is not supported yet:
        # hans-riess/robotarium#2 says what its first run found and how to add it back. The
        # runtime module that travels to the testbed is kept 3.10-compatible separately; see
        # the job below.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install, with the simulator
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[sim,test]"

    - name: Test
      run: pytest

    # The commands a person types, end to end, short of the network: the README's walkthrough.
    - name: Init, check, simulate and dry-run the two-robot example
      env:
        MPLBACKEND: Agg
      run: |
        robotarium --help
        robotarium init "$RUNNER_TEMP/try_robotarium" --example two_robots
        robotarium check "$RUNNER_TEMP/try_robotarium"
        robotarium simulate "$RUNNER_TEMP/try_robotarium"
        robotarium submit "$RUNNER_TEMP/try_robotarium" --dry-run

  runtime-on-python-3-10:
    # robotarium_runtime.py runs on the testbed's interpreter, not the one that built the bundle.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Import and exercise the runtime on 3.10
      working-directory: src
      run: |
        pip install numpy
        python - <<'PY'
        import tempfile
        import robotarium_runtime as rt
        log = rt.RunLogger("ci", directory=tempfile.mkdtemp(), save_at_exit=False)
        log.record(x=[1, 2])
        log.note("ok")
        print(rt.load_run(log.save()))
        print(rt.config(default={"ok": True}))
        PY
