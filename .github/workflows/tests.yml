name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # pyproject requires >= 3.11 (tomllib). Every version on Linux; one on macOS, where the
        # keyring backend and process handling differ. Windows is not supported yet:
        # hans-riess/robotarium#2 says what its first run found and how to add it back. The
        # runtime module that travels to the testbed is kept 3.10-compatible separately; see
        # the job below.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install, with the simulator
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[sim,test]"

    - name: Test
      run: pytest

    # The commands a person types, end to end, short of the network: the README's walkthrough.
    - name: Init, check, simulate and dry-run the two-robot example
      env:
        MPLBACKEND: Agg
      run: |
        robotarium --help
        robotarium init "$RUNNER_TEMP/try_robotarium" --example two_robots
        robotarium check "$RUNNER_TEMP/try_robotarium"
        robotarium simulate "$RUNNER_TEMP/try_robotarium"
        robotarium submit "$RUNNER_TEMP/try_robotarium" --dry-run

  runtime-on-python-3-10:
    # robotarium_runtime.py runs on the testbed's interpreter, not the one that built the bundle.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Import and exercise the runtime on 3.10
      working-directory: src
      env:
        MPLBACKEND: Agg
      run: |
        pip install numpy matplotlib
        python - <<'PY'
        import fcntl, os, tempfile, types
        import numpy as np
        import robotarium_runtime as rt
        directory = tempfile.mkdtemp()
        log = rt.RunLogger("ci", directory=directory, save_at_exit=False, dtype="float32",
                           copy_every=2, stdout_copy=True)
        log.record(x=[1.5, 2.5], n=3)
        log.note("ok")
        run = rt.load_run(log.save())
        assert run.data["x"].dtype == np.float32 and run.data["n"].dtype.kind == "i", run
        print(run)
        print(rt.config(default={"ok": True}))
        assert rt.julia_timings() == {}
        print(rt.julia_key("=1.11.9", [("JSON3", "u", "1"), ("JSON3", "u", None)], "0.9.35",
                           "0.1.24"))
        # A copy into a non-blocking stdout, as Julia leaves it, is written whole.
        flags = fcntl.fcntl(1, fcntl.F_GETFL)
        fcntl.fcntl(1, fcntl.F_SETFL, flags | os.O_NONBLOCK)
        rt._emit("non-blocking ok\n")
        fcntl.fcntl(1, fcntl.F_SETFL, flags)
        import matplotlib.pyplot as plt
        figure, axes = plt.subplots(figsize=(8.25, 5.25))
        overlay = rt.FloorOverlay(types.SimpleNamespace(_fig=figure, _axes_handle=axes))
        for k in range(3):
            overlay.segment("link", (0, 0), (0.1 * k, 0.2), color="#c03030", style=":")
            overlay.ring("slot", (0.1 * k, 0), 0.08)
            overlay.arrow("heading", (0, 0), (0.1, 0.05 * k))
            overlay.clock(k * 0.033, label="ci")
        assert overlay.error is None and overlay._artists["link"].get_linestyle() == ":"
        figure.canvas.draw()
        print("overlay ok:", overlay.keys())
        PY
